<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post de carrusel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Inter:wght@400;600;700;800&display=swap">
<style>
  /* Sistema de SOCIAL_POSTS.md: 1080x1350, fondo #0a0a0a, blobs tenues, Anton/Audiowide/Inter, dorado */
  :root { --oro: #CC941A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #0a0a0a; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; background: #0a0a0a; display: flex; flex-direction: column; overflow: hidden; }
  .titular { font-family: 'Anton', sans-serif; line-height: 1.02; text-transform: uppercase; color: #fff; }
  .titular em { font-style: normal; color: var(--oro); }
  .cuerpo { font-family: 'Inter', sans-serif; color: #c7c7c7; }
  .blob { position: absolute; border-radius: 9999px; background: var(--oro); }
  .logo { display: block; object-fit: contain; flex-shrink: 0; align-self: flex-start; position: relative; }
  .centro { position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

  .portada { padding: 72px 88px 64px; }
  .portada .logo { width: 120px; height: 120px; }
  .portada h1 { margin: 0 0 40px; font-size: 76px; text-align: center; position: relative; }
  .redes { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .redes span { font-family: 'Inter', sans-serif; color: #c7c7c7; font-size: 24px; font-weight: 600; }

  .consejo { padding: 72px 88px 80px; }
  .cabecera { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .cabecera .logo { width: 40px; height: 40px; align-self: center; }
  .contador { font-family: 'Anton', sans-serif; font-size: 36px; color: var(--oro); }
  .contador span { color: #4a4a4a; }
  .consejo h2 { margin: 0 0 24px; font-size: 60px; max-width: 880px; position: relative; }
  .consejo p { position: relative; font-size: 30px; line-height: 1.5; max-width: 860px; }

  /* Dato grande en lugar de la silueta cuando el consejo tiene una cifra */
  .dato { text-align: center; }
  .dato strong { display: block; font-family: 'Anton', sans-serif; font-weight: 400; color: var(--oro); line-height: 1; text-shadow: 0 0 80px rgba(204,148,26,0.3); }
  .dato small { display: block; margin-top: 18px; font-family: 'Audiowide', sans-serif; font-size: 34px; letter-spacing: 0.3em; padding-left: 0.3em; color: #fff; text-transform: uppercase; }

  .movil { position: relative; width: 410px; height: 760px; border-radius: 50px; border: 9px solid #1b1b1b; outline: 2px solid #333; overflow: hidden; background: #0a0a0a; box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 70px rgba(204,148,26,0.18); }
  .movil img { position: absolute; left: 0; width: 100%; }
  .portada .movil { width: 400px; height: 740px; }
</style>
</head>
<body>
  <div id="raiz"></div>
  <script>
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    // *palabra* = palabra clave en dorado
    const titular = (lineas) => lineas.map((l) => esc(l).replace(/\*(.+?)\*/g, '<em>$1</em>')).join('<br>');

    const SILUETA = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 300 420" aria-hidden="true">
      <g fill="#CC941A">
        <circle cx="150" cy="38" r="24"/><path d="M 136,56 C 136,70 136,80 138,92 L 162,92 C 164,80 164,70 164,56 Z"/>
        <circle cx="92" cy="92" r="30"/><circle cx="208" cy="92" r="30"/><circle cx="120" cy="108" r="26"/><circle cx="180" cy="108" r="26"/>
        <path d="M 96,130 C 90,165 94,200 116,232 L 184,232 C 210,200 206,165 204,130 Z"/>
        <path d="M 116,232 C 108,245 100,255 100,268 L 200,268 C 200,255 192,245 184,232 Z"/>
        <path d="M 64,88 C 60,130 64,175 70,210 L 92,210 C 96,175 100,130 102,88 Z"/><circle cx="80" cy="130" r="22"/><circle cx="80" cy="215" r="16"/>
        <rect x="56" y="209" width="48" height="12" rx="6"/><circle cx="54" cy="215" r="13"/><circle cx="106" cy="215" r="13"/>
        <path d="M 236,88 C 240,130 236,175 230,210 L 208,210 C 204,175 200,130 198,88 Z"/><circle cx="220" cy="130" r="22"/><circle cx="220" cy="215" r="16"/>
        <rect x="196" y="209" width="48" height="12" rx="6"/><circle cx="194" cy="215" r="13"/><circle cx="246" cy="215" r="13"/>
        <path d="M 100,268 C 92,290 88,310 90,332 L 140,332 C 142,310 146,290 148,268 Z"/><path d="M 90,332 C 92,350 93,370 96,390 L 128,390 C 130,370 134,350 140,332 Z"/>
        <rect x="86" y="386" width="50" height="16" rx="8"/>
        <path d="M 200,268 C 208,290 212,310 210,332 L 160,332 C 158,310 154,290 152,268 Z"/><path d="M 210,332 C 208,350 207,370 204,390 L 172,390 C 170,370 166,350 160,332 Z"/>
        <rect x="164" y="386" width="50" height="16" rx="8"/>
      </g>
      <g stroke="#0a0a0a" stroke-linecap="round">
        <line x1="150" y1="138" x2="150" y2="228" stroke-width="4"/><line x1="120" y1="110" x2="142" y2="120" stroke-width="4"/><line x1="180" y1="110" x2="158" y2="120" stroke-width="4"/>
        <line x1="126" y1="158" x2="174" y2="158" stroke-width="3"/><line x1="128" y1="182" x2="172" y2="182" stroke-width="3"/><line x1="130" y1="206" x2="170" y2="206" stroke-width="3"/>
      </g></svg>`;

    const REDES = `<div class="redes">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#CC941A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="#CC941A" stroke="none"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#CC941A" aria-hidden="true"><path d="M14 3c0 2.8 2.2 5 5 5v3c-1.8 0-3.5-.6-5-1.6v6.1c0 3.3-2.7 6-6 6s-6-2.7-6-6 2.7-6 6-6c.3 0 .7 0 1 .1v3.1c-.3-.1-.7-.2-1-.2-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3V3h3z"/></svg>
      <span>${'@ultimatefitness.utf'}</span></div>`;

    const movil = (src, desplazar = 0) => `<div class="movil"><img src="${src}" alt="" style="top:${-desplazar}px"></div>`;

    function datoGrande(s) {
      const tam = s.dato.length > 16 ? 72 : s.dato.length > 10 ? 110 : 160;
      return `<div class="dato"><strong style="font-size:${tam}px">${esc(s.dato)}</strong>${s.unidad ? `<small>${esc(s.unidad)}</small>` : ''}</div>`;
    }

    window.pintar = async (s) => {
      const raiz = document.getElementById('raiz');
      if (s.tipo === 'portada') {
        const visual = s.visual?.imagen ? movil(s.visual.imagen) : SILUETA(520, 620);
        raiz.innerHTML = `<div class="slide portada">
          <div class="blob" style="top:-220px;right:-200px;width:600px;height:600px;opacity:0.08"></div>
          <div class="blob" style="bottom:-260px;left:-200px;width:540px;height:540px;opacity:0.05"></div>
          <img class="logo" src="../assets/logo-small.png" alt="Ultimate Fitness">
          <div class="centro">${visual}</div>
          <h1 class="titular">${titular(s.titulo)}</h1>${REDES}</div>`;
      } else {
        const visual = s.tipo === 'app' ? movil(s.imagen, s.desplazar) : s.dato ? datoGrande(s) : SILUETA(440, 500);
        raiz.innerHTML = `<div class="slide consejo">
          <div class="blob" style="top:-220px;left:-200px;width:560px;height:560px;opacity:0.07"></div>
          <div class="cabecera"><img class="logo" src="../assets/logo-small.png" alt="Ultimate Fitness">
            <div class="contador">${s.tipo === 'app' ? 'FUNCIÓN' : 'TIP'} 0${s.numero}<span>/03</span></div></div>
          <div class="centro">${visual}</div>
          <h2 class="titular">${titular(s.titulo)}</h2><p class="cuerpo">${esc(s.cuerpo)}</p></div>`;
      }
      await document.fonts.load('400 60px Anton');
      await document.fonts.load('400 30px Audiowide');
      await document.fonts.load('700 30px Inter');
      await document.fonts.ready;
      await Promise.all([...document.images].map((i) => (i.complete ? i.decode().catch(() => {}) : new Promise((ok) => { i.onload = i.onerror = ok; }))));
    };
  </script>
</body>
</html>
