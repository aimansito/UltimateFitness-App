# Mantiene despierto el backend en Render (plan gratuito): sin tráfico durante 15 minutos el
# servidor se apaga y la siguiente petición tarda 30-60 s. Una llamada cada 10 minutos lo evita.
# Si algún día se pasa a un plan de pago, este workflow se puede borrar.
name: Mantener activo el backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /api/health
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://ultimate-fitness-backend.onrender.com/api/health || true)
          echo "Respuesta: $codigo"
          test "$codigo" = "200"
