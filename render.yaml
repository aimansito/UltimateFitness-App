services:
  # BACKEND (Symfony)
  - type: web
    name: ultimate-fitness-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGIN
        value: "*" # Actualizar con URL de Vercel después
      - key: DATABASE_URL
        sync: false  # secreto: se configura en el panel de Render, nunca en git
      - key: JWT_SECRET_KEY
        value: /var/www/html/config/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: /var/www/html/config/jwt/public.pem
      - key: JWT_PASSPHRASE
        sync: false  # secreto: se configura en el panel de Render, nunca en git
      # Par de claves JWT en base64 (ver backend/docker/generar-claves-jwt.sh). Fijas para que
      # las sesiones no caduquen cada vez que Render reinicia el servidor.
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      # Supabase Storage Configuration
      - key: SUPABASE_STORAGE_URL
        value: https://ozdmncejywgylyjbboip.supabase.co/storage/v1/s3
      - key: SUPABASE_REGION
        value: eu-central-1
      - key: SUPABASE_ACCESS_KEY
        sync: false  # secreto: se configura en el panel de Render, nunca en git
      - key: SUPABASE_SECRET_KEY
        sync: false  # secreto: se configura en el panel de Render, nunca en git
      - key: SUPABASE_BUCKET
        value: uploads
