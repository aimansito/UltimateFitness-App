; Ajustes de rendimiento de PHP (producción y desarrollo).
; El código compilado se guarda en memoria (opcache) y solo se comprueba si cambió cada 60 s:
; en local, tras cambiar PHP, ejecuta `apache2ctl -k graceful` en el contenedor para verlo al instante.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.enable_cli=0
realpath_cache_size=4096K
realpath_cache_ttl=600
; APCu: caché en memoria para Symfony (metadatos de Doctrine, anotaciones, validación)
apc.enabled=1
apc.shm_size=64M
