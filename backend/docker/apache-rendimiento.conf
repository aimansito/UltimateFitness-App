# Rendimiento de Apache: respuestas comprimidas y caché del navegador para archivos estáticos.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json application/javascript text/javascript text/css text/html text/plain image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    # Las imágenes subidas (avatares, fotos de entreno) cambian de nombre al cambiar: se pueden cachear sin riesgo
    <LocationMatch "^/uploads/">
        ExpiresDefault "access plus 7 days"
    </LocationMatch>
</IfModule>

KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
