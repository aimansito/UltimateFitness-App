security:
    # bcrypt con coste 11: ~100 ms por login en el servidor (coste 13 tardaba ~400 ms y en Render más).
    # Las contraseñas ya guardadas con otro coste siguen funcionando y se actualizan al iniciar sesión.
    password_hashers:
        App\Entity\Usuario:
            algorithm: auto
            cost: 11
        App\Entity\Entrenador:
            algorithm: auto
            cost: 11

    providers:
        # Busca por email o por nombre de usuario (ver App\Security\UsuarioProvider)
        usuario_provider:
            id: App\Security\UsuarioProvider

        entrenador_provider:
            entity:
                class: App\Entity\Entrenador
                property: email

        chain_provider:
            chain:
                providers: [usuario_provider, entrenador_provider]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login_user:
            pattern: ^/api/login$
            stateless: true
            provider: usuario_provider
            # El email debe estar confirmado (se comprueba tras validar la contraseña)
            user_checker: App\Security\VerificacionEmailChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: App\Security\UsuarioLoginSuccessHandler
                failure_handler: App\Security\LoginFailureHandler

        login_trainer:
            pattern: ^/api/entrenador/login$
            stateless: true
            provider: entrenador_provider
            json_login:
                check_path: /api/entrenador/login
                username_path: email
                password_path: password
                success_handler: App\Security\EntrenadorLoginSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: chain_provider
            jwt: ~

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/entrenador/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/custom/dietas/publicas, roles: PUBLIC_ACCESS }
        - { path: ^/api/custom/dietas/\d+/plan-diario, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/verificar-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/reenviar-verificacion$, roles: PUBLIC_ACCESS }
        - { path: ^/api/contacto$, roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook$, roles: PUBLIC_ACCESS }
        # Catálogo de ejercicios visible sin cuenta (la técnica completa pide registrarse)
        - { path: ^/api/custom/ejercicios$, roles: PUBLIC_ACCESS, methods: [GET] }
        # Capa social: lectura pública (el controlador filtra según quién mira)
        - { path: ^/api/perfil/publico/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/social/(seguidores|seguidos)/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/social/feed/, roles: PUBLIC_ACCESS, methods: [GET] }

        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
